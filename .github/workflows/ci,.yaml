name: ci-sonarcloud
on:
  pull_request:
    branches:
      - develop

jobs:
  run-ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: Setup golang
        uses: actions/setup-go@v6
        with:
          go-version: 1.22
      - name: Executar testes de go
        run: go test --coverprofile=coverage.out